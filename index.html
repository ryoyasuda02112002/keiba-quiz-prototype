<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3b2e" />
    <title>KEIBA GUESS | プロトタイプ</title>
    <link rel="stylesheet" href="styles.css?v=keiba-guess-20260803" />
  </head>
  <body>
    <main id="app" class="app-shell"></main>
    <script>
      const showBootError = (error) => {
        document.querySelector('#app').textContent = `読み込みエラー: ${error?.message ?? error}`;
      };
      window.addEventListener('error', (event) => showBootError(event.error ?? event.message));
      window.addEventListener('unhandledrejection', (event) => showBootError(event.reason));
    </script>
    <script type="module" src="app.js?v=verified-2025-latest-20260803"></script>
  </body>
</html>
